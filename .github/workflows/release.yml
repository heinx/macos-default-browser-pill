name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build.sh

      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --keepParent "Browser Pill.app" "Browser-Pill-${{ inputs.version }}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: Browser-Pill-${{ inputs.version }}.zip
