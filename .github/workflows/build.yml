name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Pill
          path: build/Browser Pill.app
